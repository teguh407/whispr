name: Build APK + AAB

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ./mobile
        run: chmod +x gradlew

      # Debug APK — quick install for testing
      - name: Build Debug APK
        working-directory: ./mobile
        run: ./gradlew assembleDebug --no-daemon

      # Release AAB — signed, for Google Play upload
      - name: Build Release AAB
        working-directory: ./mobile
        run: ./gradlew bundleRelease --no-daemon
        env:
          WHISPR_STORE_PASSWORD: ${{ secrets.WHISPR_STORE_PASSWORD }}
          WHISPR_KEY_PASSWORD: ${{ secrets.WHISPR_KEY_PASSWORD }}

      # Release APK — signed, for direct install / testing
      - name: Build Release APK
        working-directory: ./mobile
        run: ./gradlew assembleRelease --no-daemon
        env:
          WHISPR_STORE_PASSWORD: ${{ secrets.WHISPR_STORE_PASSWORD }}
          WHISPR_KEY_PASSWORD: ${{ secrets.WHISPR_KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whispr-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: whispr-release-aab
          path: mobile/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: whispr-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
